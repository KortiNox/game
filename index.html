<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Travel Portal</title>
</head>
<body> 
    <div class="road"></div>
    <img src="./img/main/car.png" alt="car" class="car">

    <img src="./img/main/bush1.png" alt="" class="three1 three">
    <img src="./img/main/bush3.png" alt="" class="three2 three">
    <img src="./img/main/bush2.png" alt="" class="three3 three">
    <img src="./img/main/bush3.png" alt="" class="three4 three">
    <img src="./img/main/bush2.png" alt="" class="three5 three">
    <img src="./img/main/bush1.png" alt="" class="three6 three">

    <img src="./img/icons/arrow.png" alt="arrow" class="arrow">
    <img src="./img/icons/danger.png" alt="danger" class="danger">
    <img src="./img/icons/coin.png" alt="coin" class="coin">

    <button type="button" class="game-button"> 
        <img class="pause" src="./img/icons/pause.png" alt="pause">
        <img src="./img/icons/play.png" alt="play" class="play">
    </button>
    <div class="game-score">
        0
    </div>
    <div class="backdrop">
        <div class="backdrop-container">
            <p class="finish-text" >Итоговый счет: <span class="finish-text-score" >0</span> </p>
            <button type="button" class="restart-button" >Начать заного</button>
        </div>
        
    </div>
   


    <script src="./main.js"></script>
</body>
</html>
